name: Render Agent Instruction Guide PDF

on:
  push:
    paths:
      - "notes/agent-instructions-prompts-skills-and-agents.md"
      - ".github/workflows/render-agent-instruction-guide-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-pdf:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Render Markdown to PDF
        uses: docker://pandoc/latex:3.6
        with:
          args: >-
            --from=gfm
            --pdf-engine=xelatex
            --variable=geometry:margin=1in
            --variable=colorlinks=true
            --output=notes/agent-instructions-prompts-skills-and-agents.pdf
            notes/agent-instructions-prompts-skills-and-agents.md

      - name: Commit generated PDF when changed
        run: |
          if git diff --quiet -- notes/agent-instructions-prompts-skills-and-agents.pdf; then
            echo "No PDF changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes/agent-instructions-prompts-skills-and-agents.pdf
          git commit -m "docs: render agent instruction guide PDF"
          git push
